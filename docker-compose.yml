# RepoRun stack definition. Set no backend; the frontend serves static data.
services:
  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    cpus: 0.25
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
