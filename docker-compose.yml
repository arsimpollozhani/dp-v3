services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/data/restaurant.db
      PORT: 3000
    volumes:
      - sqlite-data:/data
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  sqlite-data:
