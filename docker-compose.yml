services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/data/restaurant.db
      PORT: 3000
    volumes:
      - sqlite-data:/data

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  sqlite-data:
