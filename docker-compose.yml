# App delivery for RepoRun (and local `docker compose up --build`).
# The backend SQLite file lives on the named volume `sqlite-data`
# (DATABASE_URL=file:/data/restaurant.db) so data survives container recreation.
services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    environment:
      DATABASE_URL: file:/data/restaurant.db
      PORT: "3000"
      NODE_ENV: production
    volumes:
      - sqlite-data:/data
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    # Only used for local runs; RepoRun exposes the service through ingress.
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite-data: