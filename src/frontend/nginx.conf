# Single origin: static frontend + /api proxied to the backend service.
# React Router needs every non-file path to serve index.html.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;

  # Hashed Vite assets: safe to cache aggressively.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Public images: cache for a week.
  location /images/ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # SPA fallback: files first, then index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
